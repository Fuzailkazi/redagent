name: Agent Red-Teaming Security Gate

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target agent endpoint URL to scan'
        required: true
        default: 'https://staging-agent.example.com/chat'
      fail_under:
        description: 'Minimum resilience % required to pass gate'
        required: true
        default: '80'

jobs:
  redteam-scan:
    name: OWASP Agentic Top 10 Red-Team Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Core Engine Packages
        run: pnpm --filter @armoriq/schema build && pnpm --filter @armoriq/engine build && pnpm --filter @armoriq/reporting build

      - name: Run RedAgent Scan
        id: scan
        env:
          TARGET_URL: ${{ github.event.inputs.target_url || vars.STAGING_AGENT_URL || 'http://localhost:3000/api/mock/vulnerable' }}
          FAIL_UNDER: ${{ github.event.inputs.fail_under || '80' }}
        run: |
          echo "Starting adversarial security scan against: $TARGET_URL"
          node ./bin/redagent.mjs scan "$TARGET_URL" \
            --fail-under "$FAIL_UNDER" \
            --format markdown \
            --output report.md || echo "SCAN_FAILED=true" >> $GITHUB_ENV

      - name: Comment PR with Security Report
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '';
            if (fs.existsSync('report.md')) {
              body = fs.readFileSync('report.md', 'utf8');
            } else {
              body = '### ⚠️ RedAgent Scan Failed\nCould not reach the target agent endpoint.';
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c => c.body && c.body.includes('OWASP Agentic Top 10') || c.body.includes('RedAgent'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Enforce Security Gate
        if: env.SCAN_FAILED == 'true'
        run: |
          echo "::error::Agent resilience score is below the required security threshold ($FAIL_UNDER%). Merge blocked."
          exit 1
