# ArmorIQ red-team target config (YAML form of config.example.json).
# Secrets by reference only: use ${ENV_VAR} in headers; never inline raw tokens.
target:
  name: example-agent
  environment: staging            # "production" requires signed authorization (enforced in the API layer later)
  url: https://api.example.com/v1/chat
  method: POST
  headers:
    Authorization: "Bearer ${AGENT_TOKEN}"   # resolved from the environment at send time
  bodyTemplate:
    messages:
      - role: user
        content: "{{PROMPT}}"      # {{PROMPT}} is replaced with each probe prompt
  responsePath: choices.0.message.content   # dotted path; array indices allowed

run:
  concurrency: 4
  delaySeconds: 0.5
  timeoutMs: 30000
